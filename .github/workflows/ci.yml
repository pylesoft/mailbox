name: CI

on:
  push:
  pull_request:

jobs:
  tests-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12.*'
          - php: '8.3'
            laravel: '12.*'
          - php: '8.4'
            laravel: '12.*'
          - php: '8.4'
            laravel: '13.*'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-latest-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-latest-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - run: composer update --with "laravel/framework:${{ matrix.laravel }}" --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pest --parallel --processes=2

  qa-static-style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.4-composer-qa-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.4-composer-qa-
            ${{ runner.os }}-php-8.4-composer-

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: composer check-platform-reqs
      - run: composer audit --locked
      - run: vendor/bin/phpstan analyse --debug --no-progress
      - run: vendor/bin/pint --test

  tests-lowest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.2-composer-lowest-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-lowest-
            ${{ runner.os }}-php-8.2-composer-

      - run: composer update --with "laravel/framework:12.*" --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - run: vendor/bin/pest --parallel --processes=2
